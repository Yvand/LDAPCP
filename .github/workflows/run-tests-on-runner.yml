name: Run Visual Studio tests
on: 
  workflow_dispatch:
    inputs:
      runner_environment:
        description: 'Custom label assigned to the Windows x64 runner for this test environment'
        required: true
        type: string
permissions: {}
jobs:
  call-workflow-run-tests:
    uses: Yvand/EntraCP/.github/workflows/reusable-run-tests-on-runner.yml@copilot/review-reusable-github-workflows
    with:
      test_project_folder_name: 'Yvand.LDAPCP-unit-tests'
      runner_environment: ${{ github.event.inputs.runner_environment }}
